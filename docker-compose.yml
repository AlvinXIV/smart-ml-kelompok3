version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: postgres_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: ai_maintenance
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  web:
    build: .
    container_name: ai_predictive_maintenance
    ports:
      - "5000:5000"
    volumes:
    
      - ./data:/app/data
    environment:
      - FLASK_ENV=production
      # Database URL PostgreSQL dengan driver psycopg2
      - DATABASE_URL=postgresql+psycopg2://admin:secretpassword@db:5432/ai_maintenance
    depends_on:
      - db
    restart: always

volumes:
  pgdata:
